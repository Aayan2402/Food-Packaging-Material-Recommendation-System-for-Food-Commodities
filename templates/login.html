{% extends "base.html" %}

{% block content %}
<div style="max-width: 460px; margin: 3.5rem auto; padding: 0 1.5rem;">
  <div style="background: white; border: 1px solid var(--border-card); border-radius: var(--radius-lg); padding: 2.25rem; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-logo-icon" style="margin: 0 auto 0.75rem; width: 48px; height: 48px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--deep-navy);">{{ t('nav_login') }}</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to access your saved analyses, reports & settings</p>
    </div>

    <!-- Quick Demo Credential Buttons -->
    <div style="margin-bottom: 1.5rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: 0.85rem;">
      <div style="font-size: 0.75rem; font-weight: 700; color: var(--deep-navy); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between;">
        <span>QUICK DEMO ACCESS (CLICK TO FILL)</span>
        <span style="color: var(--primary-green-dark); font-weight: 800;">Password: demo123</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem; padding: 0.35rem 0.5rem;" onclick="setDemo('demo@packsense.ai', 'demo123')">
          👤 Default Demo
        </button>
        <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem; padding: 0.35rem 0.5rem;" onclick="setDemo('farmer@packsense.ai', 'demo123')">
          🌾 Farmer Mode
        </button>
        <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.75rem; padding: 0.35rem 0.5rem;" onclick="setDemo('lab@packsense.ai', 'demo123')">
          🔬 Industry/Lab
        </button>
      </div>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next'), lang=active_lang) }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" name="email" id="loginEmail" class="form-input" required placeholder="demo@packsense.ai" value="demo@packsense.ai">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" name="password" id="loginPassword" class="form-input" required placeholder="••••••••" value="demo123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        {{ t('nav_login') }}
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register', lang=active_lang) }}" style="color: var(--primary-green-dark); font-weight: 700; text-decoration: none;">Create one here</a>
    </div>
  </div>
</div>

<script>
  function setDemo(email, pass) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
  }
</script>
{% endblock %}
